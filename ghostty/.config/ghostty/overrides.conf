# Personal Ghostty overrides — loaded last via config-file in Omarchy's config,
# so anything here wins over Omarchy defaults and the theme.

# No in-app toasts at all (clipboard-copy, config-reload, etc.)
app-notifications = false

# Block desktop notifications from apps in the terminal (OSC 9/777),
# e.g. Claude Code's "waiting for input" popups
desktop-notifications = false
