scan_timeout = 1000
palette = "tokyo_night"

  [palettes.tokyo_night]
  blue = "#7aa2f7"
  cyan = "#7dcfff"
  purple = "#bb9af7"
  green = "#9ece6a"
  red = "#f7768e"
  yellow = "#e0af68"
  orange = "#ff9e64"
  fg = "#c0caf5"
  bg = "#1a1b26"
  comment = "#565f89"

  [character]
  success_symbol = "[❯](blue)"
  error_symbol = "[❯](red)"

  [directory]
  style = "cyan"
  truncation_length = 3
  truncate_to_repo = false

  [git_branch]
  symbol = " "
  style = "purple"
  truncation_length = 20

  [git_status]
  style = "yellow"
  ahead = "⇡${count}"
  behind = "⇣${count}"
  modified = "!"
  untracked = "?"
  staged = "+"

  [nodejs]
  symbol = " "
  style = "green"

  [python]
  symbol = " "
  style = "yellow"

  [time]
  disabled = false
  style = "comment"
  format = "[$time]($style) "

  [username]
  show_always = false

  [hostname]
  ssh_only = true
